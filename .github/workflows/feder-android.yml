name: Feder Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - feder
    paths-ignore:
      - "**.md"

jobs:
  build:
    name: Build APK (FOSS)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          submodules: false
          persist-credentials: false

      - uses: "./.github/shared_workflows/install_apt_dependencies"

      - name: Setup Flutter
        uses: adil192/setup-flutter-submodule@v3
        with:
          flutter-path: submodules/flutter
          no-save-caches: true

      - name: Setup Android build tools
        run: |
          ANDROID_NDK=/usr/local/lib/android/sdk/ndk/29.0.14206865
          echo "ANDROID_NDK=$ANDROID_NDK" >> $GITHUB_ENV
          echo "ANDROID_NDK_HOME=$ANDROID_NDK" >> $GITHUB_ENV
          echo "ANDROID_NDK_ROOT=$ANDROID_NDK" >> $GITHUB_ENV
          echo "JAVA_HOME=$JAVA_HOME_25_X64" >> $GITHUB_ENV

      - name: Signing-Schlüssel einrichten (nur aus Secrets, kein Fallback)
        env:
          KS_B64: ${{ secrets.FEDER_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.FEDER_KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.FEDER_KEY_ALIAS }}
        run: |
          if [ -z "$KS_B64" ] || [ -z "$KS_PASS" ] || [ -z "$KS_ALIAS" ]; then
            echo "::error::Signing-Secrets fehlen (FEDER_KEYSTORE_BASE64, FEDER_KEYSTORE_PASSWORD, FEDER_KEY_ALIAS). Anleitung: FEDER-DOKU.md"
            exit 1
          fi
          echo "$KS_B64" | base64 -d > android/feder-release.jks
          {
            echo "storePassword=$KS_PASS"
            echo "keyPassword=$KS_PASS"
            echo "keyAlias=$KS_ALIAS"
            echo "storeFile=../feder-release.jks"
          } > android/key.properties

      - run: flutter config --no-cli-animations
      - run: ./patches/pre/remove_proprietary_dependencies.sh
      - run: patch pubspec.lock < patches/pre/pubspec-fdroid.lock.patch

      - name: Analyze (nur eigener App-Code in lib/, Fehler brechen den Build ab)
        run: flutter analyze lib --no-fatal-infos --no-fatal-warnings

      - name: Krypto-Tests (Feder-Verschlüsselung)
        run: flutter test test/fast_bson_test.dart test/feder_crypto_test.dart test/saber_legacy_crypto_test.dart test/local_crypto_test.dart test/shape_recognizer_test.dart test/due_date_parser_test.dart test/contact_parser_test.dart test/math_solver_test.dart

      - name: Build apk
        run: |
          BUILD_NR=$((200000 + GITHUB_RUN_NUMBER))
          flutter build apk --build-number=$BUILD_NR --dart-define=FEDER_BUILD="Build ${GITHUB_RUN_NUMBER} (${GITHUB_SHA::7})"

      - name: Manifest-Prüfung (nur Information)
        run: |
          AAPT=$(ls $ANDROID_HOME/build-tools/*/aapt2 | tail -1)
          $AAPT dump xmltree --file AndroidManifest.xml build/app/outputs/flutter-apk/app-release.apk | grep -iE "mlkit|MlKitInit|provider|minSdk" | head -20 || true
          unzip -l build/app/outputs/flutter-apk/app-release.apk | grep -iE "mlkit|digitalink" | head -5 || true
          unzip -p build/app/outputs/flutter-apk/app-release.apk classes*.dex | strings | grep -c "vision/digitalink/recognition" || true

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: Feder-Build-${{ github.run_number }}
          path: build/app/outputs/flutter-apk/app-release.apk
